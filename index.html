<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prénomme — Documents légaux</title>
<style>
:root{--accent:#c97a64;--bg:#fdf6f1;--text:#2a1f1c;--muted:#6b5e58}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:680px;margin:0 auto;padding:48px 24px}
h1{font-size:32px;margin:0 0 8px;font-weight:700}
.tag{color:var(--muted);font-size:14px;margin-bottom:32px}
.cards{display:grid;gap:14px;margin-top:32px}
a.card{display:block;padding:18px 20px;background:#fff;border-radius:14px;text-decoration:none;color:var(--text);border:1px solid rgba(0,0,0,.06);transition:.15s}
a.card:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.06);border-color:var(--accent)}
a.card h2{margin:0 0 4px;font-size:17px;color:var(--accent)}
a.card p{margin:0;color:var(--muted);font-size:14px}
footer{margin-top:48px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<div class="container">
  <h1>Prénomme</h1>
  <p class="tag">Documents légaux de l'application — version 1.0</p>
  <div class="cards">
    <a class="card" href="privacy.html">
      <h2>Politique de confidentialité</h2>
      <p>Comment vos données sont protégées et utilisées.</p>
    </a>
    <a class="card" href="terms.html">
      <h2>Conditions d'utilisation</h2>
      <p>Termes du service, abonnements et obligations.</p>
    </a>
    <a class="card" href="mailto:sacha.ochmiansky@gmail.com?subject=Prénomme%20Support">
      <h2>Contact / Support</h2>
      <p>Une question ? Écrivez-nous.</p>
    </a>
  </div>
  <footer>© 2026 Sacha Ochmiansky — Prénomme</footer>
</div>
</body>
</html>
